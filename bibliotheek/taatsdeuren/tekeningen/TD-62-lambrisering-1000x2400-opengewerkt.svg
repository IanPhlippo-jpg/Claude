<text x="290" y="47.6" font-size="2.4" font-weight="700">Verstek 45°</text>
<text x="290" y="51.6" font-size="2">Hechten binnen en buiten; de zichtkant doorlassen met TIG (ER70S-6</text>
<text x="290" y="54.9" font-size="2">Ø1,6, 90-110 A), de binnenkant MIG (G3Si1 Ø0,8); zichtkant vlak</text>
<text x="290" y="58.2" font-size="2">slijpen. Beurtelings lassen, diagonalen meten.</text>
<polygon points="255,71.6 285,71.6 285,78.6 255,78.6" fill="#d7dadc" stroke="#111" stroke-width="0.25"/><polygon points="266,78.6 274,78.6 274,90.6 266,90.6" fill="#d7dadc" stroke="#111" stroke-width="0.25"/><polyline points="265,79.2 265,81.6" fill="none" stroke="#c0392b" stroke-width="0.9" stroke-linecap="round"/><polyline points="275,79.2 275,81.6" fill="none" stroke="#c0392b" stroke-width="0.9" stroke-linecap="round"/><polyline points="266,79 274,79" fill="none" stroke="#c0392b" stroke-width="0.9" stroke-linecap="round"/>
<text x="290" y="73.6" font-size="2.4" font-weight="700">T-verbinding (stomp)</text>
<text x="290" y="77.6" font-size="2">Stomp tegen het kader, het kozijn of de roede; hoeklas a3 rondom, TIG</text>
<text x="290" y="80.89999999999999" font-size="2">aan de zichtkant, MIG binnen; zichtkant vlak slijpen.</text>
<text x="253" y="97.6" font-size="2" fill="#333">Latten op de roeden (30x3): voor gehecht om de 150 en gelast, achter geschroefd met M4 verzonken om de 250.</text>
