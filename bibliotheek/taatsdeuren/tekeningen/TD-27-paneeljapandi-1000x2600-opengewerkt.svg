<text x="290" y="55.4" font-size="2.4" font-weight="700">Verstek 45°</text>
<text x="290" y="59.4" font-size="2">Hechten binnen en buiten; de zichtkant doorlassen met TIG (ER70S-6</text>
<text x="290" y="62.699999999999996" font-size="2">Ø1,6, 90-110 A), de binnenkant MIG (G3Si1 Ø0,8); zichtkant vlak</text>
<text x="290" y="66" font-size="2">slijpen. Beurtelings lassen, diagonalen meten.</text>
<polygon points="255,79.4 285,79.4 285,86.4 255,86.4" fill="#d7dadc" stroke="#111" stroke-width="0.25"/><polygon points="266,86.4 274,86.4 274,98.4 266,98.4" fill="#d7dadc" stroke="#111" stroke-width="0.25"/><polyline points="265,87 265,89.4" fill="none" stroke="#c0392b" stroke-width="0.9" stroke-linecap="round"/><polyline points="275,87 275,89.4" fill="none" stroke="#c0392b" stroke-width="0.9" stroke-linecap="round"/><polyline points="266,86.8 274,86.8" fill="none" stroke="#c0392b" stroke-width="0.9" stroke-linecap="round"/>
<text x="290" y="81.4" font-size="2.4" font-weight="700">T-verbinding (stomp)</text>
<text x="290" y="85.4" font-size="2">Stomp tegen het kader, het kozijn of de roede; hoeklas a3 rondom, TIG</text>
<text x="290" y="88.7" font-size="2">aan de zichtkant, MIG binnen; zichtkant vlak slijpen.</text>
<text x="253" y="105.4" font-size="2" fill="#333">Latten op de roeden (30x3): voor gehecht om de 150 en gelast, achter geschroefd met M4 verzonken om de 250.</text>
