<text x="290" y="73.6" font-size="2.4" font-weight="700">Boog op kalf, poot of kader</text>
<text x="290" y="77.6" font-size="2">De lasergesneden boog op de mal leggen; stomp tegen het kalf, de poot</text>
<text x="290" y="80.89999999999999" font-size="2">of het kader; hoeklas a3 rondom met TIG.</text>
<text x="253" y="97.6" font-size="2" fill="#333">Latten op de roeden (30x3): voor gehecht om de 150 en gelast, achter geschroefd met M4 verzonken om de 250.</text>
