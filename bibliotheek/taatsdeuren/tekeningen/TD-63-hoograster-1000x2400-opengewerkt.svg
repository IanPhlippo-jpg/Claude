<text x="290" y="63.2" font-size="2.4" font-weight="700">Verstek 45°</text>
<text x="290" y="67.2" font-size="2">Hechten binnen en buiten; de zichtkant doorlassen met TIG (ER70S-6</text>
<text x="290" y="70.5" font-size="2">Ø1,6, 90-110 A), de binnenkant MIG (G3Si1 Ø0,8); zichtkant vlak</text>
<text x="290" y="73.8" font-size="2">slijpen. Beurtelings lassen, diagonalen meten.</text>
<polygon points="255,87.2 285,87.2 285,94.2 255,94.2" fill="#d7dadc" stroke="#111" stroke-width="0.25"/><polygon points="266,94.2 274,94.2 274,106.2 266,106.2" fill="#d7dadc" stroke="#111" stroke-width="0.25"/><polyline points="265,94.8 265,97.2" fill="none" stroke="#c0392b" stroke-width="0.9" stroke-linecap="round"/><polyline points="275,94.8 275,97.2" fill="none" stroke="#c0392b" stroke-width="0.9" stroke-linecap="round"/><polyline points="266,94.6 274,94.6" fill="none" stroke="#c0392b" stroke-width="0.9" stroke-linecap="round"/>
<text x="290" y="89.2" font-size="2.4" font-weight="700">T-verbinding (stomp)</text>
<text x="290" y="93.2" font-size="2">Stomp tegen het kader, het kozijn of de roede; hoeklas a3 rondom, TIG</text>
<text x="290" y="96.5" font-size="2">aan de zichtkant, MIG binnen; zichtkant vlak slijpen.</text>
<text x="253" y="113.2" font-size="2" fill="#333">Latten op de roeden (30x3): voor gehecht om de 150 en gelast, achter geschroefd met M4 verzonken om de 250.</text>
