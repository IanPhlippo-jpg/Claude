<text x="290" y="51.5" font-size="2.4" font-weight="700">Verstek 45°</text>
<text x="290" y="55.5" font-size="2">Hechten binnen en buiten; de zichtkant doorlassen met TIG (ER70S-6</text>
<text x="290" y="58.8" font-size="2">Ø1,6, 90-110 A), de binnenkant MIG (G3Si1 Ø0,8); zichtkant vlak</text>
<text x="290" y="62.1" font-size="2">slijpen. Beurtelings lassen, diagonalen meten.</text>
<polygon points="255,75.5 285,75.5 285,82.5 255,82.5" fill="#d7dadc" stroke="#111" stroke-width="0.25"/><polygon points="266,82.5 274,82.5 274,94.5 266,94.5" fill="#d7dadc" stroke="#111" stroke-width="0.25"/><polyline points="265,83.1 265,85.5" fill="none" stroke="#c0392b" stroke-width="0.9" stroke-linecap="round"/><polyline points="275,83.1 275,85.5" fill="none" stroke="#c0392b" stroke-width="0.9" stroke-linecap="round"/><polyline points="266,82.9 274,82.9" fill="none" stroke="#c0392b" stroke-width="0.9" stroke-linecap="round"/>
<text x="290" y="77.5" font-size="2.4" font-weight="700">T-verbinding (stomp)</text>
<text x="290" y="81.5" font-size="2">Stomp tegen het kader, het kozijn of de roede; hoeklas a3 rondom, TIG</text>
<text x="290" y="84.8" font-size="2">aan de zichtkant, MIG binnen; zichtkant vlak slijpen.</text>
<text x="253" y="101.5" font-size="2" fill="#333">Latten op de roeden (30x3): voor gehecht om de 150 en gelast, achter geschroefd met M4 verzonken om de 250.</text>
