 Kader: regel</text><text x="323.2" y="38.33" font-size="1.95">7 Roede verticaal: kern</text><text x="373.2" y="38.33" font-size="1.95">T-verbinding (stomp)</text><line x1="253" y1="39.5" x2="409" y2="39.5" stroke="#111" stroke-width="0.13"/><text x="254.2" y="42.23" font-size="1.95">T3</text><text x="270.8" y="42.23" font-size="1.95" text-anchor="end">1</text><text x="273.2" y="42.23" font-size="1.95">5 Roede horizontaal: kern</text><text x="323.2" y="42.23" font-size="1.95">7 Roede verticaal: kern</text><text x="373.2" y="42.23" font-size="1.95">T-verbinding (stomp)</text>
