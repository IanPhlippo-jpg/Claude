<text x="290" y="71" font-size="2.4" font-weight="700">Verstek 45°</text>
<text x="290" y="75" font-size="2">Hechten binnen en buiten; de zichtkant doorlassen met TIG (ER70S-6</text>
<text x="290" y="78.3" font-size="2">Ø1,6, 90-110 A), de binnenkant MIG (G3Si1 Ø0,8); zichtkant vlak</text>
<text x="290" y="81.6" font-size="2">slijpen. Beurtelings lassen, diagonalen meten.</text>
<polygon points="255,95 285,95 285,102 255,102" fill="#d7dadc" stroke="#111" stroke-width="0.25"/><polygon points="266,102 274,102 274,114 266,114" fill="#d7dadc" stroke="#111" stroke-width="0.25"/><polyline points="265,102.6 265,105" fill="none" stroke="#c0392b" stroke-width="0.9" stroke-linecap="round"/><polyline points="275,102.6 275,105" fill="none" stroke="#c0392b" stroke-width="0.9" stroke-linecap="round"/><polyline points="266,102.4 274,102.4" fill="none" stroke="#c0392b" stroke-width="0.9" stroke-linecap="round"/>
<text x="290" y="97" font-size="2.4" font-weight="700">T-verbinding (stomp)</text>
<text x="290" y="101" font-size="2">Stomp tegen het kader, het kozijn of de roede; hoeklas a3 rondom, TIG</text>
<text x="290" y="104.3" font-size="2">aan de zichtkant, MIG binnen; zichtkant vlak slijpen.</text>
<text x="253" y="121" font-size="2" fill="#333">Latten op de roeden (30x3): voor gehecht om de 150 en gelast, achter geschroefd met M4 verzonken om de 250.</text>
