<text x="151.5" y="48" font-size="2.4" font-weight="700">Code</text>
<text x="164.5" y="48" font-size="2.4" font-weight="700">Item</text>
<text x="210.5" y="48" font-size="2.4" font-weight="700">Size (mm)</text>
<text x="244.5" y="48" font-size="2.4" font-weight="700">Requirements</text>
<text x="373.5" y="48" font-size="2.4" text-anchor="end" font-weight="700">Per door*</text>
<line x1="150" y1="51" x2="375" y2="51" stroke="#111" stroke-width="0.15"/>
<text x="151.5" y="56.6" font-size="2.8" font-weight="700">P1</text>
<text x="164.5" y="56.6" font-size="2.3">Door leaf profile (frame)</text>
<text x="210.5" y="56.6" font-size="2.3">30 x 45, wall 1.8</text>
<text x="244.5" y="55" font-size="2.1">glass channel 12.4 wide x 12 deep, centred in depth;</text>
<text x="244.5" y="58.1" font-size="2.1">cavity 14.4 x 41.4 for corner cleat C1</text>
<text x="373.5" y="56.6" font-size="2.3" text-anchor="end">6,5</text>
<line x1="150" y1="60" x2="375" y2="60" stroke="#111" stroke-width="0.15"/>
<text x="151.5" y="65.6" font-size="2.8" font-weight="700">P2</text>
<text x="164.5" y="65.6" font-size="2.3">Glazing bar (H profile)</text>
<text x="210.5" y="65.6" font-size="2.3">30 x 45, wall 1.8</text>
<text x="244.5" y="64" font-size="2.1">channel 12.4 x 12 on both sides; solid 6 mm core with 2</text>
<text x="244.5" y="67.1" font-size="2.1">screw ports Ø3.8</text>
<text x="373.5" y="65.6" font-size="2.3" text-anchor="end">4,7</text>
<line x1="150" y1="69" x2="375" y2="69" stroke="#111" stroke-width="0.15"/>
<text x="151.5" y="74.6" font-size="2.8" font-weight="700">P3</text>
<text x="164.5" y="74.6" font-size="2.3">Door frame (jamb) profile</text>
<text x="210.5" y="74.6" font-size="2.3">40 x 50, wall 2</text>
<text x="244.5" y="73" font-size="2.1">tube (may be a standard tube); mitred with corner cleat</text>
<text x="373.5" y="74.6" font-size="2.3" text-anchor="end">5,8</text>
<line x1="150" y1="78" x2="375" y2="78" stroke="#111" stroke-width="0.15"/>
<text x="151.5" y="83.6" font-size="2.8" font-weight="700">P4</text>
<text x="164.5" y="83.6" font-size="2.3">U glazing gasket</text>
<text x="210.5" y="83.6" font-size="2.3">11 x 12.4</text>
<text x="244.5" y="82" font-size="2.1">EPDM Shore A 70, black, for 8-8.8 mm glass (44.2 laminated</text>
<text x="244.5" y="85.1" font-size="2.1">or 8 tempered); on rolls</text>
<text x="373.5" y="83.6" font-size="2.3" text-anchor="end">15,3</text>
<line x1="150" y1="87" x2="375" y2="87" stroke="#111" stroke-width="0.15"/>
<text x="151.5" y="92.6" font-size="2.8" font-weight="700">C1</text>
<text x="164.5" y="92.6" font-size="2.3">Corner cleat</text>
<text x="210.5" y="92.6" font-size="2.3">fits 14.4 x 41.4</text>
<text x="244.5" y="91" font-size="2.1">aluminium, 2 legs of 60 mm, 2 M6 set screws per leg (or</text>
<text x="244.5" y="94.1" font-size="2.1">crimp type); also for P3</text>
<text x="373.5" y="92.6" font-size="2.3" text-anchor="end">6 st</text>
<line x1="150" y1="96" x2="375" y2="96" stroke="#111" stroke-width="0.15"/>
<text x="151.5" y="101.6" font-size="2.8" font-weight="700">C2</text>
<text x="164.5" y="101.6" font-size="2.3">Glazing bar screw</text>
<text x="210.5" y="101.6" font-size="2.3">stainless 4.8 x 50</text>
<text x="244.5" y="100" font-size="2.1">countersunk, through P1 into the screw port of P2 (2 per</text>
<text x="244.5" y="103.1" font-size="2.1">bar end)</text>
<text x="373.5" y="101.6" font-size="2.3" text-anchor="end">28 st</text>
<line x1="150" y1="105" x2="375" y2="105" stroke="#111" stroke-width="0.15"/>
<text x="151.5" y="110.6" font-size="2.8" font-weight="700">PV</text>
<text x="164.5" y="110.6" font-size="2.3">Pivot hinge</text>
<text x="210.5" y="110.6" font-size="2.3">door up to 150 kg</text>
<text x="244.5" y="109" font-size="2.1">bottom plate and top pin, axis 100 mm from the edge; fits</text>
<text x="244.5" y="112.1" font-size="2.1">a 45 mm deep leaf</text>
<text x="373.5" y="110.6" font-size="2.3" text-anchor="end">1 st</text>
<text x="150" y="118" font-size="2" fill="#555">* metres per door (grid door 1000 x 2400), cutting loss not included</text>
<text x="150" y="128" font-size="3" font-weight="700">General requirements</text>
<text x="152" y="134" font-size="2.4">• Alloy EN AW-6063 T6 (or T66). Tolerances to EN 755-9 and EN 12020-2; minimum wall 1.8 mm.</text>
<text x="152" y="139.2" font-size="2.4">• Finish: powder coat RAL 9005 fine texture matt, Qualicoat class 1, 60-80 µm; RAL 7016 and 9016 also wanted. Or black</text>
<text x="152" y="142.89999999999998" font-size="2.4">anodised.</text>
<text x="152" y="148.1" font-size="2.4">• Bar length 6000 mm (5800-6500 accepted), protective film on visible faces, bundled per profile.</text>
<text x="152" y="153.29999999999998" font-size="2.4">• Glass: laminated 44.2 (8.76 mm) or tempered 8 mm. Door up to 1250 x 3000 mm and 150 kg; interior use.</text>
