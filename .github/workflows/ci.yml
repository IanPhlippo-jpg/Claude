name: ci
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # the browser build on vite preview; every e2e script exits 1 when a check fails
      - run: |
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort &
          npx wait-on http://127.0.0.1:4173
          E2E_URL=http://127.0.0.1:4173/ node e2e/qa1.mjs
          E2E_URL=http://127.0.0.1:4173/ node e2e/qa2.mjs
          E2E_URL=http://127.0.0.1:4173/ node e2e/features.mjs
          E2E_URL=http://127.0.0.1:4173/ node e2e/drawing.mjs
          E2E_URL=http://127.0.0.1:4173/ node e2e/assembly.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: /tmp/phlippo-e2e
          if-no-files-found: ignore
