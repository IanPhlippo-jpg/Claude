name: ci
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    # the full regression takes about 35 minutes on a runner; a hang must not run for hours
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # no program-specific names in the visible text and no wording that names the reference program (F50, F92)
      - run: node tools/rename-trademarks.cjs --check && node tools/neutral-comments.cjs --check
      # the release build (no test hooks), then the e2e build (VITE_TEST_HOOKS=1) the regression drives
      - run: npm run build
      # the release build without test hooks, in the desktop shell (F53, F97, F100): the functional checks without hooks,
      # then the self-test (app://, the OpenCascade WASM worker, extrude, fillet, STEP, an atomic save)
      - run: xvfb-run -a node e2e/desktop-nohooks.mjs
      - run: |
          code=0; xvfb-run -a npx electron . --self-test --no-sandbox || code=$?
          cat /tmp/phlippo-self-test.json; exit $code
      - run: npm run build:e2e
      - run: npx playwright install --with-deps chromium
      # every script exits 1 on a failed check, a page error or an unexpected console error (e2e/lib/check.mjs)
      - run: |
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort &
          npx wait-on http://127.0.0.1:4173
          export PW_CHROMIUM="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          E2E_URL=http://127.0.0.1:4173/ node e2e/run-regression.mjs
          # the same feature scripts once more on the B-rep kernel (OpenCascade WASM) instead of the mesh kernel (F105)
          E2E_URL="http://127.0.0.1:4173/?kernel=brep" node e2e/run-regression.mjs features features2 filletopts endconditions multibody full doorhandle step bodies
      # the tests leave the repository as they found it (no rewritten examples, F84)
      - run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-regression-log
          path: e2e-out/regression-*.txt
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: /tmp/phlippo-e2e
          if-no-files-found: ignore
