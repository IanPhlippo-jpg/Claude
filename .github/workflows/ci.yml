name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      # flakiness (QA 0.5.11 F184): every e2e script N times, green only when all N runs are; started by hand, never on a
      # push (N = 10 makes a shard take hours):  gh workflow run ci -f repeat=10
      repeat:
        description: 'runs per e2e script in the regression jobs (E2E_REPEAT)'
        type: number
        default: 1
# Three kinds of jobs that run side by side, so a red one never hides the others (QA F147):
#   checks      typecheck, unit tests, the text checks and the release build
#   desktop     the release build in the desktop shell: without hooks, the self-test, the autosave after a restart, AutoRecover
#   regression  the browser regression as a matrix of passes, each with its own log (QA F158, F160)
#   windows-installer, regression-windows  the installer installed and tested, and the regression in Edge on Windows
# The Linux jobs run on ubuntu-24.04: ubuntu-latest moved to 26.04, for which Playwright has no Chromium (QA F54).
# Inside a job the steps that test run on with continue-on-error, and the last step fails the job when one of them failed.
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: typecheck
        continue-on-error: true
        run: npm run typecheck
      - id: unit
        continue-on-error: true
        run: npm test
      # the QA tests catch a planted fault (F184): four mutations (a split edge gives one piece, the cross-check limit x 10,
      # the fillet radius x 1.01, the linear coupler ratio inverted) must each turn their tests red; the tree is not written
      - id: mutation
        continue-on-error: true
        run: node tools/mutation-check.cjs
      # no program-specific names in the visible text and no wording that names the reference program (F50, F92)
      - id: text
        continue-on-error: true
        run: node tools/rename-trademarks.cjs --check && node tools/neutral-comments.cjs --check && node tools/line-budget.cjs
      # the release build (no test hooks)
      - id: build
        continue-on-error: true
        run: npm run build
      # the start-up script stays under its budget (F118, F174) and the README's test counts are what vitest finds (F129)
      - id: budgets
        continue-on-error: true
        run: node tools/bundle-budget.cjs && node tools/doc-counts.cjs
      # the build leaves the repository as it found it
      - id: clean
        continue-on-error: true
        run: git diff --exit-code
      - name: all checks passed
        if: always()
        run: |
          echo "typecheck=${{ steps.typecheck.outcome }} unit=${{ steps.unit.outcome }} mutation=${{ steps.mutation.outcome }} text=${{ steps.text.outcome }} build=${{ steps.build.outcome }} budgets=${{ steps.budgets.outcome }} clean=${{ steps.clean.outcome }}"
          test "${{ steps.typecheck.outcome }}" = success && test "${{ steps.unit.outcome }}" = success && test "${{ steps.mutation.outcome }}" = success && test "${{ steps.text.outcome }}" = success && test "${{ steps.build.outcome }}" = success && test "${{ steps.budgets.outcome }}" = success && test "${{ steps.clean.outcome }}" = success

  # the model tests of voorbeelden/ (extractor, desk, cable box): minutes of mesh and B-rep rebuilds, so a job of their own
  # instead of the unit step (QA 0.5.12: no time budget, a rebuild error fails the test)
  voorbeelden:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:voorbeelden -- --testTimeout=1800000

  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # the libraries Electron's Chromium needs on a bare runner
      - run: npx playwright install-deps chromium
      - run: npm run build
      # the release build without test hooks, in the desktop shell (F53, F97, F100): the functional checks without hooks,
      # then the self-test (app://, the OpenCascade WASM worker, extrude, fillet, STEP, an atomic save), then the
      # autosave in a profile of its own that is still there after a restart. The runner has no GPU: the shell draws
      # with software OpenGL (SwiftShader, F115/F128).
      - id: nohooks
        continue-on-error: true
        run: PHLIPPO_SOFTWARE_GL=1 xvfb-run -a node e2e/desktop-nohooks.mjs
      - id: selftest
        continue-on-error: true
        run: |
          code=0; xvfb-run -a npx electron . --self-test --software-gl --no-sandbox || code=$?
          cat /tmp/phlippo-self-test.json; exit $code
      - id: autosave
        continue-on-error: true
        run: PHLIPPO_SOFTWARE_GL=1 PHLIPPO_USER_DATA="$(mktemp -d)" xvfb-run -a node e2e/desktop-restore-autosave.mjs e2e/fixtures/user-part1.json
      # AutoRecover: copies per document, the folder chosen in main, a hard kill and Document Recovery (F153, F154, F156)
      - id: recover
        continue-on-error: true
        run: PHLIPPO_SOFTWARE_GL=1 xvfb-run -a node e2e/desktop-recover.mjs
      - id: clean
        continue-on-error: true
        run: git diff --exit-code
      - name: desktop checks passed
        if: always()
        run: |
          echo "nohooks=${{ steps.nohooks.outcome }} selftest=${{ steps.selftest.outcome }} autosave=${{ steps.autosave.outcome }} recover=${{ steps.recover.outcome }} clean=${{ steps.clean.outcome }}"
          test "${{ steps.nohooks.outcome }}" = success && test "${{ steps.selftest.outcome }}" = success && test "${{ steps.autosave.outcome }}" = success && test "${{ steps.recover.outcome }}" = success && test "${{ steps.clean.outcome }}" = success

  # The passes (docs/28, CI/testinfra):
  #   release  every script on what a user gets: the B-rep kernel and the rebuild worker (?kernel=brep&rebuild=worker, F158)
  #   mesh     every script on the mesh kernel and the UI thread (the e2e build's default, the fallback when OpenCascade fails)
  #   brep     the B-rep scripts on the UI thread, the control pass of F105/F120 (14 scripts, as the QA box runs them, F183)
  # The worker-only pass (mesh kernel in the worker) is gone: the release pass runs every script in the worker.
  regression:
    runs-on: ubuntu-24.04
    # the full mesh regression takes about 35 minutes on a runner; a hang must not run for hours (a repeat run gets the
    # 6 h maximum of a job)
    timeout-minutes: ${{ (inputs.repeat || 1) > 1 && 360 || 90 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # the release pass is the slowest on a runner (exact bodies in WASM, software GL): three shards, each a
          # third of the list (E2E_SHARD k/n in run-regression.mjs), so every job stays well under the limit
          - pass: release
            name: release-1of3
            query: '?kernel=brep&rebuild=worker'
            scripts: ''
            shard: '1/3'
          - pass: release
            name: release-2of3
            query: '?kernel=brep&rebuild=worker'
            scripts: ''
            shard: '2/3'
          - pass: release
            name: release-3of3
            query: '?kernel=brep&rebuild=worker'
            scripts: ''
            shard: '3/3'
          # the mesh pass too: on a runner with software GL it ran past the 90 min limit as one job (73 scripts in 89 min)
          - pass: mesh
            name: mesh-1of3
            query: ''
            scripts: ''
            shard: '1/3'
          - pass: mesh
            name: mesh-2of3
            query: ''
            scripts: ''
            shard: '2/3'
          - pass: mesh
            name: mesh-3of3
            query: ''
            scripts: ''
            shard: '3/3'
          - pass: brep
            name: brep
            query: '?kernel=brep'
            scripts: features features2 filletopts endconditions multibody full doorhandle step bodies qa2 facenames plastics loftface pmsweep
            shard: ''
    name: regression (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # the e2e build (VITE_TEST_HOOKS=1) the regression drives
      - run: npm run build:e2e
      - run: npx playwright install --with-deps chromium
      # every script exits 1 on a failed check, a page error, an unexpected console error (e2e/lib/check.mjs) or more
      # skipped steps than its budget (F155); the log is e2e-out/regression-<version>[-<pass>][-partial].txt (F160)
      - id: regression
        continue-on-error: true
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort &
          npx wait-on http://127.0.0.1:4173
          export PW_CHROMIUM="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          E2E_REPEAT="${{ inputs.repeat || 1 }}" E2E_SCRIPT_TIMEOUT=1500000 E2E_SHARD="${{ matrix.shard }}" E2E_URL="http://127.0.0.1:4173/${{ matrix.query }}" node e2e/run-regression.mjs ${{ matrix.scripts }}
      # the tests leave the repository as they found it (no rewritten examples, F84)
      - id: clean
        continue-on-error: true
        run: git diff --exit-code
      # the regression log is the evidence of a run: a missing log fails the upload (F128)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-regression-log-${{ matrix.name }}
          path: |
            e2e-out/regression-*.txt
            e2e-out/*-output.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots-${{ matrix.name }}
          path: /tmp/phlippo-e2e
          if-no-files-found: ignore
      - name: regression passed
        if: always()
        run: |
          echo "regression=${{ steps.regression.outcome }} clean=${{ steps.clean.outcome }}"
          test "${{ steps.regression.outcome }}" = success && test "${{ steps.clean.outcome }}" = success

  # Windows (QA 0.5.11 F97, F151, P0-4, P2-13): the installer is built, installed silently as a user would, and the
  # installed program is tested from the outside (desktop-installed.mjs: window, version, licences, no debugging port,
  # --self-test on app:// with the OpenCascade WASM worker); the log names the commit and every check. The runner has
  # no graphics card: the self-test draws with software GL.
  windows-installer:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --win nsis --x64 --publish never --config.directories.output=release
      - id: signature
        continue-on-error: true
        run: node tools/sign-report.cjs release
      - id: install
        continue-on-error: true
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          $setup = Join-Path (Resolve-Path release) "Phlippo CAD-Setup-$v.exe"
          $p = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
          "installer exit $($p.ExitCode)"
          Test-Path "$env:LOCALAPPDATA\Programs\Phlippo CAD\Phlippo CAD.exe"
      - id: installed
        continue-on-error: true
        run: PHLIPPO_SELFTEST_ARGS=--software-gl node e2e/desktop-installed.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installer-logs
          path: |
            e2e-out/desktop-installed-*.txt
            e2e-out/desktop-*.png
            release/signature-*.txt
          if-no-files-found: error
      - name: windows installer checks passed
        if: always()
        run: |
          echo "signature=${{ steps.signature.outcome }} install=${{ steps.install.outcome }} installed=${{ steps.installed.outcome }}"
          test "${{ steps.install.outcome }}" = success && test "${{ steps.installed.outcome }}" = success

  # the regression on Windows in Edge (the platform the program ships for), release and mesh pass in three shards each;
  # Edge gets SwiftShader for WebGL through e2e/lib/launch-args.mjs (the runner has no graphics card)
  regression-windows:
    runs-on: windows-2025
    timeout-minutes: ${{ (inputs.repeat || 1) > 1 && 360 || 120 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: win-release-1of3, query: '?kernel=brep&rebuild=worker', shard: '1/3' }
          - { name: win-release-2of3, query: '?kernel=brep&rebuild=worker', shard: '2/3' }
          - { name: win-release-3of3, query: '?kernel=brep&rebuild=worker', shard: '3/3' }
          - { name: win-mesh-1of3, query: '', shard: '1/3' }
          - { name: win-mesh-2of3, query: '', shard: '2/3' }
          - { name: win-mesh-3of3, query: '', shard: '3/3' }
    name: regression (${{ matrix.name }})
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:e2e
      - id: regression
        continue-on-error: true
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort &
          npx wait-on http://127.0.0.1:4173
          export NODE_OPTIONS="--import ./e2e/lib/launch-args.mjs"
          export E2E_BROWSER_ARGS="--use-angle=swiftshader --enable-unsafe-swiftshader --ignore-gpu-blocklist"
          E2E_REPEAT="${{ inputs.repeat || 1 }}" E2E_SCRIPT_TIMEOUT=1500000 E2E_SHARD="${{ matrix.shard }}" E2E_URL="http://127.0.0.1:4173/${{ matrix.query }}" node e2e/run-regression.mjs
      - id: clean
        continue-on-error: true
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-regression-log-${{ matrix.name }}
          path: |
            e2e-out/regression-*.txt
            e2e-out/*-output.txt
          if-no-files-found: error
      - name: regression passed
        if: always()
        run: |
          echo "regression=${{ steps.regression.outcome }} clean=${{ steps.clean.outcome }}"
          test "${{ steps.regression.outcome }}" = success && test "${{ steps.clean.outcome }}" = success
