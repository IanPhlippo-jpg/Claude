; Firmware voor de M5Stack Dial (ESP32-S3) die de afzuigventilator stuurt.
; Bouwen en flashen:  pio run -t upload   (of: python -m platformio run -t upload)
[env:m5dial]
platform = espressif32@6.9.0
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
lib_deps =
  m5stack/M5Dial@1.0.3
  m5stack/M5Unified@0.2.29
  m5stack/M5GFX@0.2.36
