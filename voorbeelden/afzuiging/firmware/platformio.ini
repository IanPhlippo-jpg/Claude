; Firmware voor de afzuiging: twee borden die draadloos (ESP-NOW) met elkaar praten.
;   knop    VIEWE-knop 1,5" (UEDX46460015-MD50E: ESP32-S3R8, 16 MB flash, 8 MB PSRAM, AMOLED 466 x 466 met CO5300 via
;           QSPI, draaiknop en drukknop): scherm en bediening
;   module  ESP32-C3 SuperMini in het elektronicavak: ventilator (PWM, aan/uit), drukmeter en filterbewaking
; Bouwen en flashen:  python -m platformio run -e knop -t upload   (USB-C in het deksel van de knophouder)
;                     python -m platformio run -e module -t upload (USB-C van de ESP32-C3, onderaan de module)
[platformio]
default_envs = knop, module

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1

[env:knop]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
  ${env.build_flags}
  -DBOARD_HAS_PSRAM
build_src_filter = +<knop/>
lib_deps =
  moononournation/GFX Library for Arduino@1.5.0

[env:module]
board = esp32-c3-devkitm-1
build_src_filter = +<module/>
