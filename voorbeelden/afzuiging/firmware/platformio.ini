; Firmware voor de VIEWE-knop 1,5" (UEDX46460015-MD50E: ESP32-S3R8, 16 MB flash, 8 MB PSRAM, AMOLED 466 x 466 met
; CO5300 via QSPI, draaiknop en drukknop) die de afzuigventilator stuurt.
; Bouwen en flashen:  pio run -t upload   (of: python -m platformio run -t upload), USB-C in de knopkuip
[env:viewe-knop-15]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DBOARD_HAS_PSRAM
lib_deps =
  olikraus/U8g2@2.35.30
  moononournation/GFX Library for Arduino@1.5.0
