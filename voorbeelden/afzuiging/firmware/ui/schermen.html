<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schermen van de knop</title>
<!-- Nabootsing van de schermen van de VIEWE-knop 1,5" (466 x 466) zoals src/knop/main.cpp ze tekent: zelfde
     posities (ontwerp op 240 x 240, geschaald), kleuren en teksten. De lettertypes lijken op die van U8g2. -->
<style>
  @font-face { font-family: 'InterKnop'; src: url('../../logo/fonts/inter-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
  :root { --bg: #f4f1ec; --tekst: #2b2723; --zacht: #6f675e; --kaart: #fff; --rand: #e2dbd1; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--tekst); font-family: Inter, Arial, Helvetica, sans-serif; }
  main { max-width: 1180px; margin: 0 auto; padding: 32px 16px 40px; }
  h1 { font-size: 26px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: var(--zacht); margin: 0 0 28px; font-size: 15px; }
  .rooster { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 22px; }
  figure { margin: 0; background: var(--kaart); border: 1px solid var(--rand); border-radius: 14px; padding: 18px 16px 14px; text-align: center; }
  svg { width: 100%; max-width: 220px; display: block; margin: 0 auto; }
  figcaption b { display: block; font-size: 15px; margin-top: 10px; }
  figcaption span { display: block; color: var(--zacht); font-size: 13px; margin-top: 2px; }
  .groep { font-size: 13px; letter-spacing: .04em; color: var(--zacht); margin: 28px 0 10px; }
  .bediening { text-align: left; }
  .bediening table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 6px; }
  .bediening td { padding: 6px 4px; border-bottom: 1px solid var(--rand); vertical-align: top; }
  .bediening td:first-child { white-space: nowrap; font-weight: 600; padding-right: 10px; }
  .stip { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
</style>
</head>
<body>
<main>
  <h1>Schermen van de draaiknop</h1>
  <p class="sub">VIEWE-knop 1,5", rond AMOLED-scherm 466 x 466. Nabootsing van wat de firmware tekent (src/knop/main.cpp).</p>
  <div class="groep">GEWOON GEBRUIK</div>
  <div class="rooster" id="gewoon"></div>
  <div class="groep">MELDINGEN</div>
  <div class="rooster" id="meldingen"></div>
</main>
<script>
const K = 466 / 240, S = (v) => v * K;
const C = { beige: '#DCCBB3', rood: '#E0533F', oranje: '#E89A3C', grijs: '#55585E', wit: '#FFFFFF', licht: '#C8C8C8', midden: '#A0A0A0' };
// ring: fillArc(120, 120, 116, 104, 135, 135 + tot), hoeken met de klok mee vanaf rechts
// zoals de firmware: spoor 105..115, boog 103..117 met kleurverloop in stappen van 2°, ronde kappen, wit handvat
const V = { beige: ['#9C7A50', '#F5E8D5'], oranje: ['#A8561A', '#F7B865'], rood: ['#962A1F', '#F47A66'] };
const SPOOR = '#2A2B2F', BEGIN = 135, BOOG = 270;
const hex = (c) => [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16));
const meng = (a, b, f) => { f = Math.min(1, Math.max(0, f)); const x = hex(a), y = hex(b); return '#' + x.map((v, i) => Math.round(v + (y[i] - v) * f).toString(16).padStart(2, '0')).join(''); };
const op = (hoek, r) => { const a = (hoek * Math.PI) / 180; return [S(120) + r * Math.cos(a), S(120) + r * Math.sin(a)]; };
function sector(a0, a1, ro, ri, kleur) {
  const p = (r, a) => op(a, r).map((v) => v.toFixed(2)).join(',');
  return `<path d="M${p(ro, a0)} A${ro},${ro} 0 0 1 ${p(ro, a1)} L${p(ri, a1)} A${ri},${ri} 0 0 0 ${p(ri, a0)} Z" fill="${kleur}"/>`;
}
function boog(tot, ro, ri, c0, c1) {
  if (tot <= 0) return '';
  const Ro = S(ro), Ri = S(ri), rm = (Ro + Ri) / 2, rk = (Ro - Ri) / 2;
  let s = '';
  for (let a = 0; a < tot; a += 2) s += sector(BEGIN + a, BEGIN + Math.min(a + 2.5, tot), Ro, Ri, meng(c0, c1, a / tot));
  const [x0, y0] = op(BEGIN, rm), [x1, y1] = op(BEGIN + tot, rm);
  return s + `<circle cx="${x0}" cy="${y0}" r="${rk}" fill="${c0}"/><circle cx="${x1}" cy="${y1}" r="${rk}" fill="${c1}"/>`;
}
function ring(tot, v) {
  let s = boog(BOOG, 115, 105, SPOOR, SPOOR);
  if (!v || tot <= 0) return s;
  s += boog(tot, 117, 103, v[0], meng(v[0], v[1], tot / BOOG));
  const [x, y] = op(BEGIN + tot, S(110));
  return s + `<circle cx="${x}" cy="${y}" r="${S(3.6)}" fill="#fff"/>`;
}
function balk(vol, v) {
  const r = Math.round(S(4.5)), w = S(110), x0 = S(120) - w / 2, y0 = S(195), h = 2 * r + 1;
  const lang = Math.min(w, Math.max(h, w * vol));
  const id = 'b' + Math.random().toString(36).slice(2, 8);
  return `<defs><linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="${x0}" x2="${x0 + w}"><stop offset="0" stop-color="${v[0]}"/><stop offset="1" stop-color="${v[1]}"/></linearGradient></defs>`
    + `<rect x="${x0}" y="${y0}" width="${w}" height="${h}" rx="${r}" fill="${SPOOR}"/><rect x="${x0}" y="${y0}" width="${lang}" height="${h}" rx="${r}" fill="url(#${id})"/>`;
}
// zoals fonts.h: Inter, y = midden van de hoofdletters (basislijn = y + hoofdletterhoogte / 2)
const FONT = { TEKST: [22, 500, 16], TITEL: [30, 600, 22], GROOT: [104, 700, 76], PROCENT: [50, 700, 37] };
const tekst = (s, y, kleur, f = FONT.TEKST) => `<text x="${S(120)}" y="${(S(y) + f[2] / 2).toFixed(1)}" font-size="${f[0]}" font-weight="${f[1]}" fill="${kleur}" text-anchor="middle" font-family="InterKnop">${s}</text>`;
const groot = (s, y, kleur) => tekst(s, y, kleur, FONT.GROOT);
const procent = (pct, y) => `<text x="${S(120)}" y="${(S(y) + FONT.GROOT[2] / 2).toFixed(1)}" text-anchor="middle" font-family="InterKnop" font-weight="700"><tspan font-size="104" fill="#FFFFFF">${pct}</tspan><tspan font-size="50" fill="${C.licht}" dx="3" dy="${-(FONT.GROOT[2] - FONT.PROCENT[2])}">%</tspan></text>`;
const regels = (a, b, kleur) => tekst(a, 158, kleur) + (b ? tekst(b, 178, kleur) : '');
// het LB-logo (logo-knop.png, 76 x 56 px, uit logo/knoplogo.py) gecentreerd op y = 52
const kop = `<image href="logo-knop.png" x="${S(120) - 38}" y="${S(52) - 28}" width="76" height="56"/>`;
const aan = (pct, v) => ring((BOOG * pct) / 100, v) + kop + procent(pct, 110);
const uit = (b) => ring(0, null) + kop + groot('UIT', 112, C.midden) + regels('druk om te starten', b, C.midden);

const gewoon = [
  ['Uit', 'kort drukken of draaien zet hem aan; na een stroomonderbreking altijd uit (ook de 24 V naar de ventilator)', uit(null)],
  ['Aan', 'de stand die de box bevestigt (% van het maximale toerental); drukverschil en toerental; balkje = verbruikte drukreserve (van schoon tot de vervanggrens, geen maat voor de belading)', aan(80, V.beige) + regels('118 Pa, 3600 tpm', null, C.licht) + balk(0.4, V.beige)],
  ['Boost', '1 s vasthouden: 100 % uit een tegoed (na het aanzetten leeg, eerste boost na 40 s; hoogstens 2 minuten), daarna afkoelen (1 s boost = 4 s); de box telt de tijd', aan(100, V.beige) + regels('BOOST 1:42', null, C.beige) + balk(0.45, V.beige)],
  ['Nieuw filter geplaatst?', '5 tot 10 s vasthouden: eerst bevestigen. Kort drukken = ijken; 3 s vasthouden = ander merk filter (nieuwe referentie, 7.2); draaien of 10 s niets doen = annuleren (de ring loopt af)', ring(BOOG * 0.7, V.beige) + kop + tekst('NIEUW FILTER?', 104, C.wit, FONT.TITEL) + tekst('schoon filter geplaatst?', 136, C.wit) + regels('kort: ijken, 3 s: ander merk', 'draaien: annuleren', C.licht)],
  ['IJken', 'na de bevestiging, met een schoon filter: 20 tot 100 %', ring(BOOG * 0.6, V.beige) + kop + tekst('IJKEN', 104, C.wit, FONT.TITEL) + tekst('schoon filter, 60 %', 136, C.wit)],
];
const meldingen = [
  ['Nieuw filter?', 'nog niet geijkt: 5 s vasthouden en bevestigen', aan(60, V.beige) + regels('nieuw filter?', 'knop 5 s vasthouden', C.licht)],
  ['Lage stand', 'onder 75 % haalt de afzuiging het minimum voor de vangst niet zeker: geen filteroordeel (dagstand 75 tot 80 %)', aan(50, V.beige) + regels('lage stand', 'weinig vangst, minstens 75 %', C.licht)],
  ['Even meten', 'na een standwissel: 6 s geen oordeel (geen oude melding)', aan(70, V.beige) + regels('even meten...', null, C.midden)],
  ['Boost even niet', 'het tegoed is op: eerst afkoelen', aan(65, V.beige) + regels('boost even niet', 'nog aan het afkoelen', C.licht)],
  ['Buiten meetbereik', 'de druk of de vervanggrens valt boven het bereik van de meter', aan(80, V.beige) + regels('druk buiten meetbereik', 'filter nakijken', C.oranje)],
  ['Filter vervangen', 'per stand vóór het debiet onder het minimum voor de vangst zakt, als de druk 5 min aan een stuk boven de grens bleef (een hand op het rooster telt niet); blijft staan tot een nieuwe ijking; eerst uitschakelen', aan(80, V.oranje) + regels('filter vervangen', 'eerst uit, filter in een zak', C.oranje) + balk(1, V.oranje)],
  ['Filter ontbreekt', 'drukverschil onder 0,70 x schoon (op elke stand): geen filter of het sluit niet af, lucht loopt om; na 3 s stopt de ventilator (zie Gestopt)', aan(80, V.oranje) + regels('filter ontbreekt', 'of sluit niet af', C.oranje)],
  ['Gestopt: filter ontbreekt', '3 s geen filter of geen luchtstroom: de box zette de ventilator stil (7.2); filter en lip nakijken, dan drukken', ring(0, null) + kop + groot('UIT', 112, C.midden) + regels('gestopt: filter ontbreekt', 'of geen luchtstroom', C.rood)],
  ['Gestopt: geen verbinding', '10 min niets van de knop: de box zette de ventilator stil (7.2)', ring(0, null) + kop + groot('UIT', 112, C.midden) + regels('gestopt: geen verbinding', 'druk om te starten', C.oranje)],
  ['Vanzelf uit', '4 uur geen enkele bediening: de box zette de afzuiging uit (7.2)', ring(0, null) + kop + groot('UIT', 112, C.midden) + regels('4 uur niets gedaan: uit', 'druk om te starten', C.licht)],
  ['Geen luchtstroom', 'drukverschil onder 0,25 x schoon: slang los of filterruimte open', aan(65, V.rood) + regels('geen luchtstroom', 'slang en filter nakijken', C.rood)],
  ['Ventilator draait niet', 'tacho geeft geen toeren (op elke stand)', aan(65, V.rood) + regels('ventilator draait niet', 'M8-kabel nakijken', C.rood)],
  ['Toerental wijkt af', 'na het stabiliseren meer dan 10 s meer dan 3 % naast het doel (of de bijregeling zit vast): de druk zegt dan niets over het filter; gaat vanzelf weg als het weer klopt', aan(80, V.rood) + regels('toerental wijkt af', 'ventilator nakijken', C.rood)],
  ['IJking geweigerd', 'de druk ligt meer dan 15 % boven de eerste ijking: geen schoon filter of een ander merk; de vorige ijking blijft. Ander merk: 5 s vasthouden, dan op "Nieuw filter?" 3 s', ring(0, null) + kop + groot('UIT', 112, C.midden) + regels('ijking geweigerd', 'ander merk? 5 s, dan 3 s', C.oranje)],
  ['IJking geweigerd (te laag)', 'onder 0,70 x de eerste ijking: geijkt zonder filter of met een kier (7.2)', ring(0, null) + kop + groot('UIT', 112, C.midden) + regels('ijking geweigerd', 'filter ontbreekt?', C.oranje)],
  ['Afzuiging herstart', 'de box is herstart (stroom weg) terwijl hij aan stond: hij blijft uit tot je drukt', ring(0, null) + kop + groot('UIT', 112, C.midden) + regels('afzuiging herstart', 'druk om aan te zetten', C.oranje)],
  ['Geen verbinding (aan)', 'niets van de box (2 s): de stand is niet bevestigd', ring(0, null) + kop + tekst('AAN?', 108, C.midden, FONT.TITEL) + regels('geen verbinding met de box', 'stand niet bevestigd', C.oranje)],
  ['Geen verbinding (uit)', 'niets van de box (2 s): ook UIT is niet bevestigd (box uit, schakelaar uit of te ver weg)', ring(0, null) + kop + tekst('UIT?', 108, C.midden, FONT.TITEL) + regels('niet bevestigd', 'geen verbinding', C.oranje)],
  ['Drukmeter niet gevonden', 'SDP810 antwoordt niet; de box start hem opnieuw', aan(65, V.beige) + regels('drukmeter niet gevonden', 'bedrading in de box nakijken', C.oranje)],
  ['Meting niet actueel', 'laatste meting ouder dan 1 s: geen drukwaarde, geen filterbalk', aan(65, V.beige) + regels('meting niet actueel', 'filterbewaking even uit', C.oranje)],
  ['IJken mislukt', 'geen, foute of te hoge metingen: de vorige ijking blijft', aan(50, V.beige) + regels('ijken mislukt', 'vorige ijking blijft', C.oranje)],
  ['Koppelen', 'nieuwe knop of 10 s vasthouden; de box aanvaardt een nieuwe knop alleen na 3 x kort aan en uit', ring(0, null) + kop + tekst('KOPPELEN', 104, C.wit, FONT.TITEL) + regels('schakelaar box 3 x', 'kort aan en uit', C.licht)],
];
const kaart = ([naam, uitleg, inhoud]) => `<figure><svg viewBox="0 0 466 466" role="img" aria-label="${naam}"><circle cx="233" cy="233" r="233" fill="#000"/>${inhoud}</svg><figcaption><b>${naam}</b><span>${uitleg}</span></figcaption></figure>`;
document.getElementById('gewoon').innerHTML = gewoon.map(kaart).join('');
document.getElementById('meldingen').innerHTML = meldingen.map(kaart).join('') + `<figure class="bediening"><b style="font-size:15px">Bediening en kleuren</b><table>
<tr><td>Draaien</td><td>zuigkracht 20 tot 80 % (80 % = dagstand)</td></tr>
<tr><td>Kort drukken</td><td>aan / uit</td></tr>
<tr><td>1 s vasthouden</td><td>boost, 100 % uit het tegoed</td></tr>
<tr><td>5-10 s vasthouden</td><td>nieuw filter: daarna kort drukken = ijken</td></tr>
<tr><td>10 s vasthouden</td><td>opnieuw koppelen met de box</td></tr>
<tr><td><span class="stip" style="background:${C.beige}"></span>Beige</td><td>alles in orde</td></tr>
<tr><td><span class="stip" style="background:${C.oranje}"></span>Oranje</td><td>aandacht: filter, ijking, verbinding</td></tr>
<tr><td><span class="stip" style="background:${C.rood}"></span>Rood</td><td>storing: geen lucht, toerental of ventilator stil</td></tr></table></figure>`;
</script>
</body>
</html>
