<text x="23.00" y="22.00" font-size="2.9" text-anchor="start" font-family="Arial, Helvetica, sans-serif" >Knip het grijze kwart weg en leg de mal in de rechtervoorhoek van de uitsparing: de dikke lijnen tegen de randen.</text>
