<text x="23.00" y="30.80" font-size="2.9" text-anchor="start" font-family="Arial, Helvetica, sans-serif" >Boor met de gatzaag eerst tot de centreerboor er onder uitkomt, en zaag van onderen af: zo splintert het blad niet.</text>
