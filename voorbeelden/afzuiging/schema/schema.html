<text x="210" y="60" font-size="12" text-anchor="middle" fill="#111" font-weight="700">Afzuiging Lush Beauty</text>
<text x="210" y="74" font-size="7" text-anchor="middle" fill="#111">Aansluitschema elektronica</text>
<text x="210" y="84" font-size="3.6" text-anchor="middle" fill="#444">Ventilator Delta PFR1212UHE-SP00 · module ESP32-C3 · knop VIEWE 1,5" (draadloos) · verschildrukmeting Sensirion SDP810-500Pa</text>
<text x="120" y="115" font-size="5" text-anchor="start" fill="#111" font-weight="700">Inhoud</text>
<text x="120" y="127" font-size="4" text-anchor="start" fill="#111">Blad 1</text>
<text x="150" y="127" font-size="4" text-anchor="start" fill="#111">Titelblad en inhoud</text>
<text x="120" y="136" font-size="4" text-anchor="start" fill="#111">Blad 2</text>
<text x="150" y="136" font-size="4" text-anchor="start" fill="#111">Voeding 12 V en 5 V: netadapter, DC-bus, schakelaar, zekering, regelaar</text>
<text x="120" y="145" font-size="4" text-anchor="start" fill="#111">Blad 3</text>
<text x="150" y="145" font-size="4" text-anchor="start" fill="#111">Ventilator: aan/uit (-Q3) en snelheid PWM (-Q1)</text>
<text x="120" y="154" font-size="4" text-anchor="start" fill="#111">Blad 4</text>
<text x="150" y="154" font-size="4" text-anchor="start" fill="#111">Besturing -A4, verschildrukmeter -B1 en de knop -A1 (5 V over USB-C, draadloos gestuurd)</text>
<text x="120" y="163" font-size="4" text-anchor="start" fill="#111">Blad 5</text>
<text x="150" y="163" font-size="4" text-anchor="start" fill="#111">Klemmenplan en bedrading</text>
<text x="120" y="172" font-size="4" text-anchor="start" fill="#111">Blad 6</text>
<text x="150" y="172" font-size="4" text-anchor="start" fill="#111">Stuklijst</text>
<text x="120" y="195" font-size="4" text-anchor="start" fill="#111" font-weight="700">Leeswijzer</text>
<text x="120" y="205" font-size="3.2" text-anchor="start" fill="#333">Codes volgens IEC 81346: -T netadapter, -F zekering, -Q schakelaars, -R weerstanden, -C condensatoren,</text>
<text x="120" y="211.5" font-size="3.2" text-anchor="start" fill="#333">-M motor, -A besturing, -B sensor, -X klemmen en connectoren.</text>
<text x="120" y="218" font-size="3.2" text-anchor="start" fill="#333">Potentialen: L+ = +12 V, L5 = +5 V (-A4 en de knop), L3 = +3,3 V (uit -A4, voor de drukmeter), M = 0 V. /3.2 = blad 3, kolom 2.</text>
<text x="120" y="224.5" font-size="3.2" text-anchor="start" fill="#333">Alles behalve de netadapter en de knop zit in het elektronicavak van de romp (gaatjesprint -A2 van 30 x 70 mm en -A4).</text>
<text x="120" y="231" font-size="3.2" text-anchor="start" fill="#333">De knop -A1 zit in de knophouder in het blad; hij krijgt 5 V over een USB-C-kabel -W1 (-X8 -&gt; -X7) en stuurt -A4 draadloos (ESP-NOW).</text>
</svg></div>

<text x="250" y="30" font-size="4" text-anchor="start" fill="#111" font-weight="700">Bedrading</text>
<text x="250" y="40" font-size="2.8" text-anchor="start" fill="#333">Alle klemmen zitten op de gaatjesprint -A2 (30 x 70 mm) in het elektronicavak.</text>
<text x="250" y="46" font-size="2.8" text-anchor="start" fill="#333">Schroefklem -X3 (ventilator) met steek 3,5 mm. -A4 en -X8 met draadjes op -A2.</text>
<text x="250" y="52" font-size="2.8" text-anchor="start" fill="#333">De ventilatorkabel gaat door de doorvoer in de tussenwand (dichten met een tule).</text>
<text x="250" y="58" font-size="2.8" text-anchor="start" fill="#333">-X8 en de USB-C van -A4 zitten onderaan de module, in de bodemplaat.</text>
<text x="250" y="64" font-size="2.8" text-anchor="start" fill="#333">De USB-C-kabel -W1 (C-C, 0,5 m, liefst haaks) loopt in de sleuf onder het blad naar het</text>
<text x="250" y="70" font-size="2.8" text-anchor="start" fill="#333">deksel van de knophouder (-X7). Een andere lengte = een andere kabel: niets knippen.</text>
<text x="250" y="76" font-size="2.8" text-anchor="start" fill="#333">Op -A3: FPC-bus 10-polig 0,5 mm voor de knop en de USB-C-bus -X7.</text>
<text x="250" y="82" font-size="2.8" text-anchor="start" fill="#333">Draadkleuren van de ventilator vóór het solderen nameten.</text>
