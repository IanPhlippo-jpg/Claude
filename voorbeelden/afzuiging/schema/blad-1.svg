<polyline points="15,253 15,292" fill="none" stroke="#111" stroke-width="0.25"/><text x="17" y="258" font-size="2.2" text-anchor="start" fill="#666">Project</text><text x="17" y="266" font-size="3.2" text-anchor="start" fill="#111">Afzuiging Lush Beauty</text>
<text x="17" y="273" font-size="2.4" text-anchor="start" fill="#444">inbouw nagelstofafzuiging, versie 7.1</text>
<polyline points="85,253 85,292" fill="none" stroke="#111" stroke-width="0.25"/><text x="87" y="258" font-size="2.2" text-anchor="start" fill="#666">Bladtitel</text><text x="87" y="269" font-size="5.5" text-anchor="start" fill="#111" font-weight="700">Titelblad</text>
<polyline points="205,253 205,292" fill="none" stroke="#111" stroke-width="0.25"/><text x="207" y="258" font-size="2.2" text-anchor="start" fill="#666">Installatie / plaats</text><text x="207" y="266" font-size="3.2" text-anchor="start" fill="#111">=AFZ +BOX</text>
<text x="207" y="273" font-size="2.4" text-anchor="start" fill="#444">voedingsbox onder het blad</text>
<polyline points="265,253 265,292" fill="none" stroke="#111" stroke-width="0.25"/><text x="267" y="258" font-size="2.2" text-anchor="start" fill="#666">Norm</text><text x="267" y="266" font-size="3.2" text-anchor="start" fill="#111">IEC 81346 / 60617</text>
<text x="267" y="273" font-size="2.4" text-anchor="start" fill="#444">EPLAN-stijl</text>
<polyline points="315,253 315,292" fill="none" stroke="#111" stroke-width="0.25"/><text x="317" y="258" font-size="2.2" text-anchor="start" fill="#666">Datum / getekend</text><text x="317" y="266" font-size="3.2" text-anchor="start" fill="#111">2026-11-08</text>
<text x="317" y="273" font-size="2.4" text-anchor="start" fill="#444">Phlippo CAD</text>
<polyline points="365,253 365,292" fill="none" stroke="#111" stroke-width="0.25"/><text x="367" y="258" font-size="2.2" text-anchor="start" fill="#666">Blad</text><text x="367" y="269" font-size="5.5" text-anchor="start" fill="#111" font-weight="700">1 / 6</text>
<text x="210" y="60" font-size="12" text-anchor="middle" fill="#111" font-weight="700">Afzuiging Lush Beauty</text>
<text x="210" y="74" font-size="7" text-anchor="middle" fill="#111">Aansluitschema elektronica</text>
<text x="210" y="84" font-size="3.6" text-anchor="middle" fill="#444">Radiale ventilator San Ace C175 (24 V) · voedingsbox met ESP32-C3 · knop VIEWE 1,5" (draadloos) · drukmeting Sensirion SDP810</text>
<text x="120" y="115" font-size="5" text-anchor="start" fill="#111" font-weight="700">Inhoud</text>
<text x="120" y="127" font-size="4" text-anchor="start" fill="#111">Blad 1</text>
<text x="150" y="127" font-size="4" text-anchor="start" fill="#111">Titelblad en inhoud</text>
<text x="120" y="136" font-size="4" text-anchor="start" fill="#111">Blad 2</text>
<text x="150" y="136" font-size="4" text-anchor="start" fill="#111">Voeding 24 V en 5 V: netadapter, schakelaar, zekering, regelaar (voedingsbox)</text>
<text x="120" y="145" font-size="4" text-anchor="start" fill="#111">Blad 3</text>
<text x="150" y="145" font-size="4" text-anchor="start" fill="#111">Ventilator: M8-kabel, snelheid PWM (-Q1) en toerental (tacho)</text>
<text x="120" y="154" font-size="4" text-anchor="start" fill="#111">Blad 4</text>
<text x="150" y="154" font-size="4" text-anchor="start" fill="#111">Besturing -A4, verschildrukmeter -B1 en de knop -A1 (5 V over USB-C, draadloos gestuurd)</text>
<text x="120" y="163" font-size="4" text-anchor="start" fill="#111">Blad 5</text>
<text x="150" y="163" font-size="4" text-anchor="start" fill="#111">Klemmenplan en bedrading</text>
<text x="120" y="172" font-size="4" text-anchor="start" fill="#111">Blad 6</text>
<text x="150" y="172" font-size="4" text-anchor="start" fill="#111">Stuklijst</text>
<text x="120" y="181" font-size="4" text-anchor="start" fill="#111">Bijlage</text>
<text x="150" y="181" font-size="4" text-anchor="start" fill="#111">Freesmallen 1:1 op A4, per doos een PDF: Freesmal-afzuiging, -knop en -voedingsbox (op 100 % afdrukken)</text>
<text x="120" y="195" font-size="4" text-anchor="start" fill="#111" font-weight="700">Leeswijzer</text>
<text x="120" y="205" font-size="3.2" text-anchor="start" fill="#333">Codes volgens IEC 81346: -T netadapter, -F zekering, -Q schakelaars, -R weerstanden, -C condensatoren,</text>
<text x="120" y="211.5" font-size="3.2" text-anchor="start" fill="#333">-M motor, -A besturing, -B sensor, -X klemmen en connectoren.</text>
<text x="120" y="218" font-size="3.2" text-anchor="start" fill="#333">Potentialen: L+ = +24 V, L5 = +5 V (-A4 en de knop), L3 = +3,3 V (uit -A4), M = 0 V. /3.2 = blad 3, kolom 2.</text>
<text x="120" y="224.5" font-size="3.2" text-anchor="start" fill="#333">De voedingsbox (onder het blad) bevat de netadapter -T1, de schakelaar -S1 en de print -A2 met -A4 en -B1.</text>
<text x="120" y="231" font-size="3.2" text-anchor="start" fill="#333">In de afzuiging zit alleen de ventilator -M1 (M8-kabel -W2). De knop -A1 krijgt 5 V over USB-C (-W1) en stuurt -A4 draadloos.</text>
</svg>