<text x="23.00" y="22.00" font-size="2.9" text-anchor="start" font-family="Arial, Helvetica, sans-serif" >Deel 1 (links). Knip deel 2 af langs de stippellijn en leg het op de lijmrand: de drie kruisjes en de hartlijn vallen samen.</text>
<text x="23.00" y="26.40" font-size="2.9" text-anchor="start" font-family="Arial, Helvetica, sans-serif" >Plak de mal met afplaktape op het blad, middelpunt in het midden van het blad (700 van links, 300 van voor).</text>
<text x="23.00" y="30.80" font-size="2.9" text-anchor="start" font-family="Arial, Helvetica, sans-serif" >Alleen om af te tekenen en na te meten: frezen langs de MDF-mal (AFZ-21) met kopieerring Ø17 en frees Ø12.</text>
