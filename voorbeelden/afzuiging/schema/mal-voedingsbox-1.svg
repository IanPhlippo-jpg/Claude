<text x="10.00" y="20.00" font-size="2.9" text-anchor="start" font-family="Arial, Helvetica, sans-serif" >Onderkant: leg het blad met de bovenkant op een deken. Links van het blad wijst naar boven, de voorkant naar rechts.</text>
