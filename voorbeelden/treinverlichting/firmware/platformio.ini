; Firmware voor de lichtsturing van de modelbaan ("Treinbaan").
;   doos    ESP32-S3-DevKitC-1 N16R8 (16 MB flash, 8 MB PSRAM) in de doos onder de baan:
;           16 lichtgroepen via een PCA9685, 16 ingangen rechtstreeks op GPIO's (via optocouplers), eigen wifi-hotspot met dashboard
; Bouwen en flashen:  python -m platformio run -e doos -t upload      (micro-USB "UART" of "USB" van het DevKitC-bord v1.1)
; Seriële monitor:    python -m platformio device monitor -e doos
; Tests van de logica (include/*.h) op de pc:  python -m platformio test -e native  (vraagt gcc/g++ in het PATH)
;                                     met 32 groepen:  python -m platformio test -e native32
; Het dashboard (ui/dashboard.html) wordt bij elk bouwen van `doos` vanzelf ingepakt in src/dashboard.h
; (ui/maak-header.py); met de hand kan ook:  python ui/maak-header.py
[platformio]
default_envs = doos

[env]
lib_deps =
  bblanchon/ArduinoJson@7.2.1

[env:doos]
platform = espressif32@6.9.0
framework = arduino
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
monitor_speed = 115200
extra_scripts = pre:ui/maak-header.py
build_src_filter = +<*> -<pc/>
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1

; de logica zonder hardware: de tests (test/test_*) en een kleine proef (src/pc/proef.cpp, pio run -e native);
; niet in default_envs
[env:native]
platform = native@1.2.1
build_flags = -std=gnu++17 -Iinclude -Wall
build_src_filter = +<pc/>
test_build_src = no

; dezelfde logica met 32 groepen (een tweede PCA9685 op 0x41): alle tests moeten ook hier slagen.
; Voor de doos zelf: zet -DTREIN_GROEPEN=32 bij [env:doos] build_flags (README, "Uitbreiden").
[env:native32]
platform = native@1.2.1
build_flags = -std=gnu++17 -Iinclude -Wall -DTREIN_GROEPEN=32
build_src_filter = +<pc/>
test_build_src = no
