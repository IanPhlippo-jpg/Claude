<text x="200" y="130" font-size="2.3" text-anchor="start" fill="#000">1 kΩ (niet 10 kΩ): de PCA9685-print trekt OE zelf laag (Adafruit: "pulled low by default"); met 10 kΩ</text>
<text x="200" y="135" font-size="2.3" text-anchor="start" fill="#000">tegen 10 kΩ zou OE op 1,65 V blijven hangen. Meetpunt in het meetblad: OE ≥ 2,5 V bij reset.</text>
