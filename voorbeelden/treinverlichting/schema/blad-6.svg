<text x="200" y="160" font-size="2.3" text-anchor="start" fill="#000">Uitbreiden tot 32 groepen: een tweede PCA9685 op 0x41 (A0 aan 3,3 V), SDA, SCL, OE, VCC en GND parallel,</text>
<text x="200" y="165" font-size="2.3" text-anchor="start" fill="#000">en een tweede uitgangsprint; firmware bouwen met -DTREIN_GROEPEN=32 (firmware/README.md). Vrije GPIO: 11, 39, 42, 47, 48.</text>
<text x="25" y="244" font-size="2.5" text-anchor="start" fill="#000">I2C van -K1 naar -K2 met de pull-ups op de PCA9685-print (10 kΩ).</text>
