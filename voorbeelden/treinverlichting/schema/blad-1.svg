<text x="267" y="273" font-size="2.4" text-anchor="start" fill="#444">EPLAN-stijl</text>
<polyline points="315,253 315,292" fill="none" stroke="#111" stroke-width="0.25"/><text x="317" y="258" font-size="2.2" text-anchor="start" fill="#666">Datum / getekend</text><text x="317" y="266" font-size="3.2" text-anchor="start" fill="#111">2026-11-08</text>
<text x="317" y="273" font-size="2.4" text-anchor="start" fill="#444">Phlippo CAD</text>
<polyline points="365,253 365,292" fill="none" stroke="#111" stroke-width="0.25"/><text x="367" y="258" font-size="2.2" text-anchor="start" fill="#666">Blad</text><text x="367" y="269" font-size="5.5" text-anchor="start" fill="#111" font-weight="700">1 / 6</text>
<text x="215" y="60" font-size="12" text-anchor="middle" fill="#111" font-weight="700">Treinbaan: kabeldoos verlichting</text>
<text x="215" y="74" font-size="7" text-anchor="middle" fill="#111">Aansluitschema</text>
<text x="215" y="84" font-size="3.6" text-anchor="middle" fill="#444">16 lichtgroepen (Modelbouwled-bordjes) · 16 ingangen · ESP32-S3 met eigen wifi en dashboard · 12 V</text>
<text x="120" y="115" font-size="5" text-anchor="start" fill="#111" font-weight="700">Inhoud</text>
<text x="120" y="127" font-size="4" text-anchor="start" fill="#111">Blad 1</text>
<text x="150" y="127" font-size="4" text-anchor="start" fill="#111">Titelblad en inhoud</text>
<text x="120" y="136" font-size="4" text-anchor="start" fill="#111">Blad 2</text>
<text x="150" y="136" font-size="4" text-anchor="start" fill="#111">Voeding: netadapter, hoofdzekering, 6 polyfuses (een per rij), 5 V-regelaar</text>
<text x="120" y="145" font-size="4" text-anchor="start" fill="#111">Blad 3</text>
<text x="150" y="145" font-size="4" text-anchor="start" fill="#111">Uitgangen: PCA9685, 16 MOSFET's, de 16 bordjes</text>
<text x="120" y="154" font-size="4" text-anchor="start" fill="#111">Blad 4</text>
<text x="150" y="154" font-size="4" text-anchor="start" fill="#111">Ingangen: 16 optocouplers naar de ESP</text>
<text x="120" y="163" font-size="4" text-anchor="start" fill="#111">Blad 5</text>
<text x="150" y="163" font-size="4" text-anchor="start" fill="#111">Besturing: ESP32-S3, I2C, statuslampje</text>
<text x="120" y="172" font-size="4" text-anchor="start" fill="#111">Blad 6</text>
<text x="150" y="172" font-size="4" text-anchor="start" fill="#111">Klemmenplan en stuklijst</text>
<text x="120" y="195" font-size="4" text-anchor="start" fill="#111" font-weight="700">Leeswijzer</text>
<text x="120" y="205" font-size="3.2" text-anchor="start" fill="#333">Codes volgens IEC 81346: -T voeding, -F zekeringen, -C condensatoren, -A printen, -Q MOSFET's, -U optocouplers,</text>
<text x="120" y="211.5" font-size="3.2" text-anchor="start" fill="#333">-R weerstanden, -X klemmen, -E de bordjes van Modelbouwled (16 leds elk, met een weerstand per led).</text>
<text x="120" y="218" font-size="3.2" text-anchor="start" fill="#333">Potentialen: L+ = 12 V na de hoofdzekering, L+1..L+6 = 12 V per rij bordjes (na de polyfuse), L5 = 5 V, L3 = 3,3 V, M = 0 V.</text>
<text x="120" y="224.5" font-size="3.2" text-anchor="start" fill="#333">Een groep schakelt de min van zijn bordje (MOSFET naar M); de plus komt van de rail van zijn rij.</text>
</svg>