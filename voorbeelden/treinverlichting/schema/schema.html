<text x="25" y="200" font-size="2.2" text-anchor="start" fill="#000">-E21..-E28: IR-led 940 nm (Vishay TSAL6200), op de baan; per led -R10..-R17 120 Ω 0,5 W (pootje in de klem n+ van -Q4, het andere in -X9 WAGO 221-2411): piek 89 mA, gemiddeld ± 15 mA (§9).</text>
<text x="25" y="205" font-size="2.2" text-anchor="start" fill="#000">IR-led n brandt alleen als GPAn hoog is (-Q4 kanaal n aan) EN GPIO47 de draaggolf geeft (-Q3): één gemoduleerd signaal, een schakeluitgang per led. Codering NEC, RC5 of raw (geleerd).</text>
<text x="25" y="210" font-size="2.2" text-anchor="start" fill="#000">Leren: -B1 (TSMP58000) geeft de draaggolf door: de firmware meet frequentie en pulstijden van de eigen zender van Ian. -B2..-B4: gedemoduleerd (38 kHz), actief laag; een FTR-reflexsensor</text>
<text x="25" y="215" font-size="2.2" text-anchor="start" fill="#000">(fototransistor, TCRT5000-module, AANNAME) werkt op dezelfde klem als hij op 3,3 V werkt. Ontvangers op de baan: 3,3 V uit -X12, 0 V uit -X13, kabel getwist, hoogstens 3 m (AANNAME), RC-filter bij de ontvanger.</text>
<text x="25" y="227" font-size="2.2" text-anchor="start" fill="#000">-Q4: 8-kanaals MOSFET-module met optocouplers (zoals -Q1), VCC = L3, VIN+ = L+: kanaal n aan = IR-led n doet mee. -Q3: MOSFET-module AOD4184 zonder optocoupler (snel genoeg voor de draaggolf).</text>
<text x="25" y="222" font-size="2.2" text-anchor="start" fill="#000">Kruisverwijzingen naar blad 6 (besturing): GPIO47, GPIO48, GPIO11, GPIO39, GPIO42, SDA, SCL en L3 (3,3 V). Plaats in de doos: TRN-10 en TRN-11.</text>
