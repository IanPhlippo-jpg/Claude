; Firmware van het geluidskastje (treinverlichting versie 6): ESP32-S3-Zero (Waveshare, ESP32-S3FH4R2: 4 MB flash,
; 2 MB PSRAM) + MAX98357A (I2S, 3 W) + luidspreker 40 mm 4 ohm. Meldt zich elke 30 s aan bij de doos ("Treinbaan"),
; speelt WAV's uit LittleFS (PCM 16-bit mono, 8 tot 22,05 kHz) en neemt nieuwe geluiden aan van het dashboard.
; Bouwen en flashen (USB-C van de ESP32-S3-Zero; BOOT vasthouden bij het insteken als hij niet gevonden wordt):
;     python -m platformio run -e kastje -t upload
; Seriële monitor:  python -m platformio device monitor -e kastje
; Tests van de logica (include/*.h) op de pc (vraagt gcc/g++ in het PATH):  python -m platformio test -e native
[platformio]
default_envs = kastje

[env]
lib_deps =
  bblanchon/ArduinoJson@7.2.1

[env:kastje]
platform = espressif32@6.9.0
framework = arduino
board = esp32-s3-devkitc-1
; de ESP32-S3-Zero heeft 4 MB flash in de chip (quad, net als de devkitc-1-instelling)
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = partities.csv
board_build.filesystem = littlefs
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1

; de logica zonder hardware: de tests (test/test_*); niet in default_envs
[env:native]
platform = native@1.2.1
build_flags = -std=gnu++17 -Iinclude -Wall -DUNITY_INCLUDE_DOUBLE
test_build_src = no
