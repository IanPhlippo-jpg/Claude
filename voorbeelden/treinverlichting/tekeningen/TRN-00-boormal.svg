<text x="300.00" y="27.00" font-size="2.6" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-weight="bold" fill="#111">Boormal op ware grootte, van onderen gezien</text>
<text x="300.00" y="32.00" font-size="2.6" text-anchor="start" font-family="Arial, Helvetica, sans-serif" fill="#111">(het deksel naar je toe, de bodem tegen de baan).</text>
<text x="300.00" y="37.00" font-size="2.6" text-anchor="start" font-family="Arial, Helvetica, sans-serif" fill="#111"></text>
<text x="300.00" y="42.00" font-size="2.6" text-anchor="start" font-family="Arial, Helvetica, sans-serif" fill="#111">1  Mal onder de baan plakken (tape), de 4 kruisjes</text>
<text x="300.00" y="47.00" font-size="2.6" text-anchor="start" font-family="Arial, Helvetica, sans-serif" fill="#111">    voorboren Ø2,5.</text>
<text x="300.00" y="52.00" font-size="2.6" text-anchor="start" font-family="Arial, Helvetica, sans-serif" fill="#111">2  4 bolkopschroeven 4 x 20 indraaien tot de kop</text>
<text x="300.00" y="57.00" font-size="2.6" text-anchor="start" font-family="Arial, Helvetica, sans-serif" fill="#111">    4 mm onder de baan staat.</text>
<text x="300.00" y="62.00" font-size="2.6" text-anchor="start" font-family="Arial, Helvetica, sans-serif" fill="#111">3  De doos met de grote gaten (stippellijn) over de</text>
<text x="300.00" y="67.00" font-size="2.6" text-anchor="start" font-family="Arial, Helvetica, sans-serif" fill="#111">    koppen houden en 6 mm naar links schuiven:</text>
<text x="300.00" y="72.00" font-size="2.6" text-anchor="start" font-family="Arial, Helvetica, sans-serif" fill="#111">    de schroef zit dan op het kruisje, aan het eind</text>
<text x="300.00" y="77.00" font-size="2.6" text-anchor="start" font-family="Arial, Helvetica, sans-serif" fill="#111">    van de sleuf.</text>
<text x="300.00" y="82.00" font-size="2.6" text-anchor="start" font-family="Arial, Helvetica, sans-serif" fill="#111">4  De schroeven aandraaien tot de doos vastzit.</text>
<text x="300.00" y="87.00" font-size="2.6" text-anchor="start" font-family="Arial, Helvetica, sans-serif" fill="#111"></text>
<text x="300.00" y="92.00" font-size="2.6" text-anchor="start" font-family="Arial, Helvetica, sans-serif" fill="#111">Doos 248,9 x 240,6 x 28,8 (met het deksel).</text>
<text x="300.00" y="97.00" font-size="2.6" text-anchor="start" font-family="Arial, Helvetica, sans-serif" fill="#111">Laat links en rechts 60 mm vrij voor de kabels.</text>
