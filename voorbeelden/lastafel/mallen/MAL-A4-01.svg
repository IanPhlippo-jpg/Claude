<g><text x="14" y="28" font-size="3.4">16 x · S355, plaat 5 mm (8 wangen, 2 koppen per wang) · schaararmen A en B; dezelfde mal voor beide koppen (omdraaien)</text><text x="14" y="32.4" font-size="3.1" fill="#333">Aftekenen: hartlijn over de hele plaat; boorpunten op 0, 1040 en 2080 (meetlint).</text><text x="14" y="36.6" font-size="3.1" fill="#333">Hoogte vanaf de hartlijn: ±58 bij 0 en 2080, ±80 bij 1040. Rechte randen met een lat.</text><text x="14" y="40.8" font-size="3.1" fill="#333">Mal op het boorpunt en de hartlijn leggen, R58 aftekenen. Boringen 1 mm kleiner, na het lassen ruimen.</text></g></svg>